spring:
  application:
    name: back

  output:
    ansi:
      enabled: always

  # 資料庫連線資訊
  datasource:
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
    url: jdbc:sqlserver://35.221.153.166:1433;DatabaseName=camp;trustServerCertificate=true;
    username: sqlserver
    password: shanatova
    

  # 多國語系設定
  messages:
    basename: i18n.Messages
    encoding: UTF-8
    fallback-to-system-locale: false

  # JPA設定
  jpa:
    show-sql: true
    database-platform: org.hibernate.dialect.SQLServerDialect
    hibernate:
      ddl-auto: validate

  # Jackson 日期格式
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Taipei

  profiles:
    active: '@xxx@'


# 允許公開訪問的路徑
  ignored:
    - "/api/auth/login"
    - "/api/auth/register"
    - "/api/public/**"
    - "/api-docs/**"
    - "/swagger-ui/**"
    - "/swagger-ui.html"



# 設定檔案上傳大小限制
servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB

server:
  tomcat:
    max-swallow-size: -1

#上傳檔案路徑
file:
  upload-dir:
    campArea: uploads/img/campArea
    toilet: uploads/img/toilet


